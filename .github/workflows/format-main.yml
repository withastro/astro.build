name: Format main branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.repository_owner == 'withastro'
    uses: withastro/automation/.github/workflows/format.yml@4105de6eb7f9f5ead48cef759e197b38db2b82b1 # v1.3.4
    with:
      command: "format"
    secrets: inherit
