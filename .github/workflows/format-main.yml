name: Format main branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.repository_owner == 'withastro'
    uses: withastro/automation/.github/workflows/format.yml@d6bf66bb1fbfb68577eccfa1211ff7357fea0054 # v1.3.3
    with:
      command: "format"
    secrets: inherit
